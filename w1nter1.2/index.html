<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Acceso</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <main class="auth-container" aria-labelledby="auth-title">
        <header class="auth-header" id="header-login">
            <p class="eyebrow">Escuela Juan Vucetich · Mar del Plata</p>
            <h1 id="auth-title">Bienvenido</h1>
        </header>

        <header class="auth-header hidden" id="header-register" aria-hidden="true">
            <p class="eyebrow">Escuela Juan Vucetich · Mar del Plata</p>
            <h1>Crear cuenta</h1>
            <p>Registra una cuenta para acceder al sistema.</p>
        </header>

        <div id="alert-box" class="alert" role="status" aria-live="polite" hidden></div>

        <form id="auth-form" novalidate>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" autocomplete="email" required maxlength="254">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required minlength="6">
            </div>

            <button type="submit" class="btn-primary" id="btn-submit">Iniciar sesión</button>
        </form>

        <p class="toggle-mode">
            <span id="toggle-text">¿No tienes cuenta?</span>
            <a href="#" id="toggle-btn">Registrarse</a>
        </p>
    </main>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
